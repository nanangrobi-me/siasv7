<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAS - SDN 011 Sangatta Selatan</title>
    <base target="_top">
    
    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #059669;
            --primary-hover: #047857;
            --secondary-color: #64748b;
            --bg-light: #f8fafc;
            --sidebar-width: 270px;
            --sidebar-collapsed-width: 75px;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.08);
            --transition-speed: 0.2s;
            --sidebar-bg: #0f172a;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-light: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --border-color: #334155;
            --sidebar-bg: #070a13;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        #wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--sidebar-bg);
            color: #f8fafc;
            transition: width var(--transition-speed) ease;
            display: flex;
            flex-direction: column;
            z-index: 100;
            border-right: 1px solid var(--border-color);
        }

        #sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
            min-width: var(--sidebar-collapsed-width);
        }

        #sidebar .brand {
            padding: 1.25rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid #1e293b;
            overflow: hidden;
            white-space: nowrap;
        }

        #sidebar .menu-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        #sidebar .menu-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.5rem;
            color: #94a3b8;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
            border-left: 4px solid transparent;
            white-space: nowrap;
        }

        #sidebar .menu-item:hover, #sidebar .menu-item.active {
            color: #fff;
            background: #1e293b;
            border-left-color: var(--primary-color);
        }

        #sidebar.collapsed .menu-item {
            padding: 0.75rem 0;
            justify-content: center;
        }

        #sidebar.collapsed .menu-item span, #sidebar.collapsed .brand span {
            display: none;
        }

        #content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .navbar-custom {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .main-container {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            background: var(--bg-light);
        }

        .card-custom {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            border-left: 5px solid var(--primary-color);
        }

        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #fff;
        }

        /* Tampilan Utama / Login Baru yang Modern & Cepat */
        #auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f19;
            position: relative;
            overflow: hidden;
        }

        .auth-wrapper {
            display: flex;
            width: 100%;
            max-width: 1050px;
            min-height: 600px;
            background: #111827;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            position: relative;
            z-index: 1;
            margin: 1.5rem;
        }

        .auth-left-banner {
            flex: 1;
            background: linear-gradient(135deg, rgba(6, 78, 59, 0.95) 0%, rgba(4, 47, 46, 0.95) 100%), 
                        url('https://i.ibb.co.com/ynzFZRnF/Burung-Enggang-Kalimantan-Hewan-Khas-Kalimantan-Timur-yang-Menjadi-Simbol-Kehormatan-Suku-Dayak.webp');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #ffffff;
            position: relative;
        }

        .auth-left-banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(5, 150, 105, 0.2) 0%, transparent 70%);
            pointer-events: none;
        }

        .auth-right-form {
            width: 460px;
            background: #ffffff;
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media (max-width: 900px) {
            .auth-wrapper {
                flex-direction: column;
                max-width: 460px;
            }
            .auth-left-banner {
                padding: 2rem;
                text-align: center;
            }
        }

        /* Hilangkan spinner/panah pada input type number */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        @media print {
            .no-print, #sidebar, .navbar-custom, #themeToggle, #sidebarToggle, .btn, .swal2-actions, .swal2-close {
                display: none !important;
            }
            /* Menyembunyikan dashboard latar belakang jika modal rekap sedang terbuka */
            body.swal2-shown #app-root {
                display: none !important;
            }
            body, html, #app-root, #wrapper, #content, .main-container {
                display: block !important;
                height: auto !important;
                min-height: auto !important;
                overflow: visible !important;
                background: white !important;
                color: black !important;
                position: static !important;
            }
            .swal2-container, .swal2-backdrop-show {
                position: static !important;
                background: transparent !important;
                overflow: visible !important;
            }
            .swal2-popup {
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }
            .card-custom {
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
            }
            #rekap-printable-content, .table-responsive {
                max-height: none !important;
                overflow: visible !important;
            }
            table {
                page-break-inside: auto !important;
                width: 100% !important;
            }
            tr {
                page-break-inside: avoid !important;
                page-break-after: auto !important;
            }
            thead {
                display: table-header-group !important;
            }
        }
    </style>
    
    <script>
        window.addEventListener('error', function(e) {
            console.error("Global Catcher Terdeteksi:", e);
            const appRoot = document.getElementById("app-root");
            if (appRoot) {
                const errorMsg = e.message || (e.error ? e.error.message : "Sistem mengalami masalah eksekusi");
                appRoot.innerHTML = `
                    <div class="container py-5 text-dark">
                        <div class="alert alert-danger shadow border-2" style="border-radius:12px;">
                            <h4 class="fw-bold"><i class="fa-solid fa-triangle-exclamation me-2"></i>Sistem Mendeteksi Error Peluncuran (Crash)</h4>
                            <hr>
                            <p class="mb-1"><strong>Pesan Kesalahan:</strong> <code class="bg-dark text-warning p-1 rounded">${errorMsg}</code></p>
                            <div class="d-flex gap-2 mt-3">
                                <button class="btn btn-danger btn-sm" onclick="clearCrashCache()">Bersihkan Cache & Reset Paksa</button>
                                <button class="btn btn-outline-secondary btn-sm" onclick="location.reload()">Muat Ulang Halaman</button>
                            </div>
                        </div>
                    </div>
                `;
                const loader = document.getElementById("loader-overlay");
                if (loader) loader.classList.add("d-none");
            }
        });

        function clearCrashCache() {
            localStorage.removeItem("sias_db");
            sessionStorage.removeItem("sias_user");
            sessionStorage.removeItem("sias_original_user");
            sessionStorage.removeItem("sias_is_impersonating");
            location.reload();
        }
    </script>
</head>
<body>

    <div id="loader-overlay" class="d-none">
        <div class="text-center">
            <div class="spinner-border text-success" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Memproses...</span>
            </div>
            <p class="mt-3 fs-6 fw-semibold text-white" id="loader-text">Memuat Sistem...</p>
        </div>
    </div>

    <div id="app-root"></div>

    <!-- JS Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const LOGO_SVG = `<img src="logo.png" alt="Logo SDN 011 Sangatta Selatan" style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));" onerror="this.onerror=null; this.src='https://placehold.co/100x100/059669/ffffff?text=011';">`;

        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwG02Y_0VyR10XUjJ8FXgEsQWnS9bvPTVB3mXgBq_8Ktvj5whU9S0Cj-fOCDgsDFGAvQA/exec";

        const DB_DEFAULTS = {
            User: [
                {Username: "admin", Password: "admin123_hashed", Nama: "Administrator Utama", Role: "Admin"}
            ],
            Siswa: [],
            Guru: [],
            MataPelajaran: [],
            Kelas: [],
            JurnalMengajar: [],
            Absensi: [],
            Nilai: [],
            Pengaturan: {
                Logo: "011_svg",
                Sekolah: "SDN 011 Sangatta Selatan",
                Alamat: "Jl. Poros Sangatta Selatan, Kab. Kutai Timur, Kalimantan Timur",
                NPSN: "30405566",
                Email: "info@sdn011sangattaselatan.sch.id",
                Website: "www.sdn011sangattaselatan.sch.id",
                Kepsek: "Hermin Rante Pasang, S.Pd",
                NIPKepsek: "197503122005012001"
            },
            LogAktivitas: []
        };

        let db = null;

        const State = {
            currentUser: JSON.parse(sessionStorage.getItem("sias_user")) || null,
            currentView: "dashboard",
            theme: localStorage.getItem("sias_theme") || "light",
            sidebarCollapsed: false,
            activeTable: null,
            charts: {},
            originalUser: JSON.parse(sessionStorage.getItem("sias_original_user")) || null,
            isImpersonating: sessionStorage.getItem("sias_is_impersonating") === "true"
        };

        async function fetchAPI(payload) {
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            } catch (err) {
                console.error("API Request Error:", err);
                throw err;
            }
        }

        function getAllowedClasses() {
            if (!db || !db.Kelas) return [];
            if (State.currentUser && State.currentUser.role === 'Admin') {
                return db.Kelas.map(k => k.KodeKelas);
            }
            const teacherName = State.currentUser ? State.currentUser.nama : "";
            const classesAsWali = db.Kelas.filter(k => k.WaliKelas === teacherName).map(k => k.KodeKelas);
            const classesAsSubjectTeacher = db.MataPelajaran 
                ? db.MataPelajaran.filter(m => m.GuruPengampu === teacherName).map(m => m.Kelas) 
                : [];
            let allowed = [...new Set([...classesAsWali, ...classesAsSubjectTeacher])].filter(Boolean);
            if (allowed.length === 0) allowed = db.Kelas.map(k => k.KodeKelas);
            return allowed;
        }

        function getAllowedMapel() {
            if (!db || !db.MataPelajaran) return [];
            if (State.currentUser && State.currentUser.role === 'Admin') {
                return db.MataPelajaran.map(m => m.NamaMataPelajaran);
            }
            const teacherName = State.currentUser ? State.currentUser.nama : "";
            let allowed = db.MataPelajaran.filter(m => m.GuruPengampu === teacherName).map(m => m.NamaMataPelajaran);
            if (allowed.length === 0) allowed = db.MataPelajaran.map(m => m.NamaMataPelajaran);
            return [...new Set(allowed)];
        }

        function filterMapelDropdownByKelas(kelasSelectId, mapelSelectId) {
            const kelasSelect = document.getElementById(kelasSelectId);
            const mapelSelect = document.getElementById(mapelSelectId);
            if (!kelasSelect || !mapelSelect) return;

            const selectedKelas = kelasSelect.value;
            const isGuru = State.currentUser && State.currentUser.role === 'Guru';
            const teacherName = State.currentUser ? State.currentUser.nama : "";

            let filtered = db.MataPelajaran ? db.MataPelajaran.filter(m => m.Kelas === selectedKelas) : [];
            if (isGuru) filtered = filtered.filter(m => m.GuruPengampu === teacherName);

            mapelSelect.innerHTML = '<option value="">-- Pilih Pelajaran --</option>' + 
                filtered.map(m => `<option value="${m.NamaMataPelajaran}">${m.NamaMataPelajaran}</option>`).join('');
        }

        function impersonateTeacher(index) {
            const g = db.Guru[index];
            if (!g) return;

            Swal.fire({
                title: 'Mulai Penyamaran?',
                text: `Anda akan bertindak sementara sebagai Guru: ${g.Nama}.`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#3b82f6',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya, Mulai',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    State.originalUser = { ...State.currentUser };
                    sessionStorage.setItem("sias_original_user", JSON.stringify(State.originalUser));
                    State.currentUser = { username: g.NIP, nama: g.Nama, role: "Guru" };
                    State.isImpersonating = true;
                    sessionStorage.setItem("sias_user", JSON.stringify(State.currentUser));
                    sessionStorage.setItem("sias_is_impersonating", "true");
                    logAktivitas("Mulai menyamar sebagai guru: " + g.Nama);
                    location.reload();
                }
            });
        }

        function stopImpersonating() {
            if (!State.originalUser) {
                sessionStorage.removeItem("sias_is_impersonating");
                sessionStorage.removeItem("sias_original_user");
                handleLogout();
                return;
            }
            State.currentUser = { ...State.originalUser };
            State.originalUser = null;
            State.isImpersonating = false;
            sessionStorage.setItem("sias_user", JSON.stringify(State.currentUser));
            sessionStorage.removeItem("sias_original_user");
            sessionStorage.setItem("sias_is_impersonating", "false");
            logAktivitas("Keluar dari sesi penyamaran.");
            location.reload();
        }

        function showModalSafe(id) {
            try {
                const el = document.getElementById(id);
                if (el && typeof bootstrap !== 'undefined') {
                    let modalInstance = bootstrap.Modal.getInstance(el);
                    if (!modalInstance) modalInstance = new bootstrap.Modal(el);
                    modalInstance.show();
                }
            } catch (e) {
                console.error("Gagal membuka modal:", id, e);
            }
        }

        function hideModalSafe(id) {
            try {
                const el = document.getElementById(id);
                if (el && typeof bootstrap !== 'undefined') {
                    const modalInstance = bootstrap.Modal.getInstance(el);
                    if (modalInstance) modalInstance.hide();
                }
                document.querySelectorAll(".modal-backdrop").forEach(b => b.remove());
            } catch (e) {
                console.error("Gagal menutup modal:", id, e);
            }
        }

        function initAppDatabase() {
            // Muat instan dari cache lokal demi kecepatan maksimal tanpa jeda loading awal
            try {
                db = JSON.parse(localStorage.getItem("sias_db"));
            } catch (e) {
                db = null;
            }
            
            if (!db || !db.Pengaturan || !db.User) {
                db = JSON.parse(JSON.stringify(DB_DEFAULTS));
                localStorage.setItem("sias_db", JSON.stringify(db));
            }
            window.db = db;
            initApp();

            // Ambil pembaruan dari GAS di background secara asinkronus (tidak memblokir render pertama)
            fetch(GAS_API_URL + "?action=getAllData")
                .then(res => res.json())
                .then(data => {
                    if (data && data.Pengaturan) {
                        db = data;
                        localStorage.setItem("sias_db", JSON.stringify(db));
                        window.db = db;
                    }
                })
                .catch(err => console.warn("Sinkronisasi background dilewati:", err));
        }

        function saveDB(sheetName, dataObj, keyCol, keyVal) {
            window.db = db;
            localStorage.setItem("sias_db", JSON.stringify(db));
            fetchAPI({
                action: 'saveRecord',
                sheetName: sheetName,
                data: dataObj,
                keyColumn: keyCol,
                keyValue: keyVal
            }).catch(err => console.error(`Sinkronisasi ${sheetName} gagal:`, err));
        }

        function deleteDB(sheetName, keyCol, keyVal) {
            window.db = db;
            localStorage.setItem("sias_db", JSON.stringify(db));
            fetchAPI({
                action: 'deleteRecord',
                sheetName: sheetName,
                keyColumn: keyCol,
                keyValue: keyVal
            }).catch(err => console.error(`Hapus data ${sheetName} gagal:`, err));
        }

        function logAktivitas(aktivitas) {
            const date = new Date();
            const timestamp = date.toISOString().replace('T', ' ').substring(0, 19);
            const user = State.currentUser ? State.currentUser.nama : "System";
            const logObj = { Timestamp: timestamp, User: user, Aktivitas: aktivitas };
            if (!db.LogAktivitas) db.LogAktivitas = [];
            db.LogAktivitas.unshift(logObj);
            saveDB("LogAktivitas", logObj, null, null);
        }

        function showLoader(text) {
            const loaderText = document.getElementById("loader-text");
            const loaderOverlay = document.getElementById("loader-overlay");
            if (loaderText) loaderText.innerText = text || "Memproses...";
            if (loaderOverlay) loaderOverlay.classList.remove("d-none");
        }

        function hideLoader() {
            const loaderOverlay = document.getElementById("loader-overlay");
            if (loaderOverlay) loaderOverlay.classList.add("d-none");
        }

        function initApp() {
            const root = document.getElementById("app-root");
            if (!root) return;
            
            if (State.currentUser) {
                root.innerHTML = renderMainLayout();
                switchView("dashboard");
            } else {
                root.innerHTML = renderLogin();
                const loginForm = document.getElementById("login-form");
                if (loginForm) {
                    loginForm.addEventListener("submit", handleLoginSubmit);
                }
            }
            document.body.setAttribute("data-theme", State.theme);
        }

        function renderLogin() {
            return `
            <div id="auth-container">
                <div class="auth-wrapper">
                    <!-- Sisi Kiri: Logo, Nama, Motto, dan Burung Enggang Kalimantan -->
                    <div class="auth-left-banner">
                        <div>
                            <div style="width: 70px; height: 70px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.2);">
                                ${LOGO_SVG}
                            </div>
                            <h3 class="fw-bold text-white mb-2" style="letter-spacing: -0.5px;">SIAS SDN 011</h3>
                            <p class="text-emerald-100 opacity-90 small mb-4" style="font-size: 13px;">Sistem Informasi Administrasi Sekolah Terpadu</p>
                        </div>
                        
                        <div class="my-4" style="border-left: 3px solid #10b981; padding-left: 1rem;">
                            <blockquote class="blockquote text-white mb-0" style="font-size: 0.95rem; font-style: italic; opacity: 0.95;">
                                "Unggul dalam Prestasi, Berkarakter Luhur, Berwawasan Lingkungan, Berdasarkan Iman dan Taqwa."
                            </blockquote>
                            <figcaption class="blockquote-footer text-emerald-200 mt-1 mb-0" style="font-size: 11px;">
                                Motto Resmi SDN 011 Sangatta Selatan
                            </figcaption>
                        </div>

                        <div class="text-xs opacity-75" style="font-size: 11px;">
                            © 2026 SDN 011 Sangatta Selatan. All Rights Reserved.
                        </div>
                    </div>

                    <!-- Sisi Kanan: Form Login -->
                    <div class="auth-right-form">
                        <div class="mb-4">
                            <h4 class="fw-bold text-dark mb-1" style="font-size: 1.35rem;">Selamat Datang</h4>
                            <p class="text-muted small">Silakan masuk menggunakan akun Anda.</p>
                        </div>
                        
                        <form id="login-form">
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-secondary" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">Nama Pengguna / NIP</label>
                                <div class="input-group shadow-sm" style="border-radius: 10px; overflow: hidden; border: 1px solid #cbd5e1;">
                                    <span class="input-group-text bg-white text-muted border-0 px-3"><i class="fa-solid fa-user-shield text-success"></i></span>

        async function switchView(viewName) {
            State.currentView = viewName;
            
            document.querySelectorAll('#sidebar .menu-item').forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('onclick') && item.getAttribute('onclick').includes(`switchView('${viewName}')`)) {
                    item.classList.add('active');
                }
            });

            const contentArea = document.getElementById("main-content-area");
            if (!contentArea) return;

            try {
                let htmlContent = "";
                switch (viewName) {
                    case "dashboard": htmlContent = await getDashboardHTML(); break;
                    case "siswa": htmlContent = getSiswaHTML(); break;
                    case "guru": htmlContent = getGuruHTML(); break;
                    case "mapel": htmlContent = getMapelHTML(); break;
                    case "kelas": htmlContent = getKelasHTML(); break;
                    case "jurnal": htmlContent = getJurnalHTML(); break;
                    case "absensi": htmlContent = getAbsensiHTML(); break;
                    case "nilai": htmlContent = getNilaiHTML(); break;
                    case "cetak-jurnal": htmlContent = getCetakJurnalHTML(); break;
                    case "pengaturan": htmlContent = getPengaturanHTML(); break;
                    default: htmlContent = await getDashboardHTML();
                }
                
                contentArea.innerHTML = htmlContent;
                
                if (viewName === "dashboard") initDashboardCharts();
                else if (viewName === "siswa") initDataTable("siswa-table");
                else if (viewName === "guru") initDataTable("guru-table");
                else if (viewName === "mapel") initDataTable("mapel-table");
                else if (viewName === "kelas") initDataTable("kelas-table");
                else if (viewName === "jurnal") initDataTable("jurnal-table");
            } catch (err) {
                console.error("Gagal memuat view:", viewName, err);
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            if (sidebar) {
                sidebar.classList.toggle("collapsed");

        }

        function toggleTheme() {
            State.theme = State.theme === 'dark' ? 'light' : 'dark';

            document.body.setAttribute("data-theme", State.theme);
            const icon = document.querySelector("#themeToggle i");
            if (icon) icon.className = State.theme === 'dark' ? "fa-solid fa-sun" : "fa-solid fa-moon";

            Swal.fire({

                confirmButtonColor: '#d33',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya',

            }).then((result) => {

            }).then((result) => {

                    const idx = db.User.findIndex(u => u.Username === g.NIP);

            deleteDB("JurnalMengajar", "ID", j.ID);
            switchView('jurnal');
        }

        function saveJurnal(event) {
            event.preventDefault();
            const idx = document.getElementById("jurnal-idx").value;
            const dataJurnal = {
                ID: idx !== "" ? db.JurnalMengajar[idx].ID : "J" + Date.now(),
                Tanggal: document.getElementById("jurnal-tgl").value,
                Guru: document.getElementById("jurnal-guru").value,
                Kelas: document.getElementById("jurnal-kelas").value,
                MataPelajaran: document.getElementById("jurnal-mapel").value,
                Jam: document.getElementById("jurnal-jam").value,
                Materi: document.getElementById("jurnal-materi").value,
                TujuanPembelajaran: document.getElementById("jurnal-tujuan").value,
                Kegiatan: document.getElementById("jurnal-kegiatan").value,
                Refleksi: document.getElementById("jurnal-refleksi").value,
                Catatan: document.getElementById("jurnal-catatan").value
            };
            if (!db.JurnalMengajar) db.JurnalMengajar = [];
            if (idx === "") db.JurnalMengajar.push(dataJurnal); else db.JurnalMengajar[idx] = dataJurnal;
            saveDB("JurnalMengajar", dataJurnal, "ID", dataJurnal.ID);
            hideModalSafe('jurnalModal');
            switchView('jurnal');
        }

                <h6 class="fw-bold text-dark mb-2"><i class="fa-solid fa-file-invoice me-2 text-info"></i>Menu Rekapitulasi Bulanan (Guru Kelas & Guru Mapel)</h6>
                <p class="text-muted m-0 mb-3" style="font-size: 12px;">Pilih periode bulan untuk menghasilkan laporan presensi otomatis. Tampilan rekap Guru Kelas mencakup 1 bulan penuh, sedangkan Guru Mapel menyusun per pertemuan (P1, P2, P3, dst.).</p>

                    <div class="col-sm-5 col-12">
                        <select id="rekap-select-bulan" class="form-select form-select-sm text-dark fw-semibold">${optionBulan}</select>

        if (typeof window.activeAbsenSiswa === 'undefined') window.activeAbsenSiswa = [];

        function loadSiswaAbsen(event) {
            if (event) event.preventDefault();
            const kelas = document.getElementById("absen-kelas").value;
            const mapel = document.getElementById("absen-mapel").value;
            const tgl = document.getElementById("absen-tgl").value;

            if (!kelas) {
                Swal.fire('Peringatan', 'Pilih kelas terlebih dahulu.', 'warning');
                return;
            }

            const siswaFiltered = (db.Siswa || []).filter(s => s.Kelas === kelas && s.Status === 'Aktif');
            if (siswaFiltered.length === 0) {
                Swal.fire('Informasi', 'Tidak ada siswa aktif pada kelas ini.', 'info');
                return;
            }

            // Ambil presensi berdasarkan Tanggal, Kelas, dan Mata Pelajaran secara presisi agar tidak tercampur antar akun/mapel
            const existingAbsen = (db.Absensi || []).filter(a => String(a.Tanggal) === String(tgl) && String(a.Kelas) === String(kelas) && String(a.MataPelajaran) === String(mapel));

            window.activeAbsenSiswa = siswaFiltered.map(s => {
                const found = existingAbsen.find(item => String(item.NIS) === String(s.NIS));
                return {
                    NIS: s.NIS,
                    Nama: s.Nama,
                    Status: found ? found.Status : "Hadir",
                    Keterangan: found ? found.Keterangan : ""
                };
            });

            const tbody = document.getElementById("absen-siswa-list");
            if (tbody) {
                tbody.innerHTML = window.activeAbsenSiswa.map((s, idx) => `
                    <tr>
                        <td><strong>${s.NIS}</strong></td>
                        <td>${s.Nama}</td>
                        <td class="text-center">
                            <div class="btn-group" role="group" aria-label="Status Kehadiran">
                                <input type="radio" class="btn-check" name="status-${idx}" id="hadir-${idx}" value="Hadir" ${s.Status === 'Hadir' ? 'checked' : ''} onchange="window.activeAbsenSiswa[${idx}].Status='Hadir'">
                                <label class="btn btn-outline-success btn-sm px-2" for="hadir-${idx}">Hadir</label>

                                <input type="radio" class="btn-check" name="status-${idx}" id="izin-${idx}" value="Izin" ${s.Status === 'Izin' ? 'checked' : ''} onchange="window.activeAbsenSiswa[${idx}].Status='Izin'">
                                <label class="btn btn-outline-warning btn-sm px-2" for="izin-${idx}">Izin</label>

                                <input type="radio" class="btn-check" name="status-${idx}" id="sakit-${idx}" value="Sakit" ${s.Status === 'Sakit' ? 'checked' : ''} onchange="window.activeAbsenSiswa[${idx}].Status='Sakit'">
                                <label class="btn btn-outline-primary btn-sm px-2" for="sakit-${idx}">Sakit</label>

                                <input type="radio" class="btn-check" name="status-${idx}" id="alpa-${idx}" value="Alpa" ${s.Status === 'Alpa' ? 'checked' : ''} onchange="window.activeAbsenSiswa[${idx}].Status='Alpa'">
                                <label class="btn btn-outline-danger btn-sm px-2" for="alpa-${idx}">Alpa</label>
                            </div>
                        </td>
                        <td>
                            <input type="text" class="form-control form-control-sm" value="${s.Keterangan}" placeholder="Keterangan (opsional)..." onchange="window.activeAbsenSiswa[${idx}].Keterangan=this.value">
                        </td>
                    </tr>`).join('');
            }
            document.getElementById("absensi-daftar-card").classList.remove("d-none");
        }

        function showRekapBulanan() {
            const kelas = document.getElementById("absen-kelas").value;
            const mapel = document.getElementById("absen-mapel").value || "Guru Kelas";
            const bulan = parseInt(document.getElementById("rekap-select-bulan").value);
            const tahun = parseInt(document.getElementById("rekap-select-tahun").value);
            const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"][bulan];

            const siswaList = db.Siswa ? db.Siswa.filter(s => s.Kelas === kelas && s.Status === 'Aktif') : [];
            const isGuruKelas = mapel === "Guru Kelas" || mapel === "";
            const modalTitle = isGuruKelas ? "Rekap Presensi Bulanan (Guru Kelas)" : `Rekap Presensi Bulanan Mata Pelajaran (${mapel})`;

            // Ambil data absensi nyata dari database yang cocok dengan kelas & mapel
            const allAbsen = db.Absensi || [];
            const filteredAbsen = allAbsen.filter(a => {
                if (a.Kelas !== kelas) return false;
                if (isGuruKelas) {
                    if (a.MataPelajaran && a.MataPelajaran !== "Guru Kelas") return false;
                } else {
                    if (a.MataPelajaran !== mapel) return false;
                }
                if (!a.Tanggal) return false;
                const d = new Date(a.Tanggal + 'T00:00:00');
                return d.getMonth() === bulan && d.getFullYear() === tahun;
            });

            let tableHeaderHtml = "";
            let tableBodyHtml = "";

            if (isGuruKelas) {
                const jumlahHari = new Date(tahun, bulan + 1, 0).getDate();
                let headerTanggalHtml = '';
                let weekendMap = {};
                for (let d = 1; d <= jumlahHari; d++) {
                    const dayOfWeek = new Date(tahun, bulan, d).getDay();
                    if (dayOfWeek === 0) { weekendMap[d] = 'Min'; headerTanggalHtml += `<th class="text-center p-1 text-white bg-danger" style="font-size:10px;">${d}<br>Min</th>`; }
                    else if (dayOfWeek === 6) { weekendMap[d] = 'Sab'; headerTanggalHtml += `<th class="text-center p-1 text-white bg-warning" style="font-size:10px;">${d}<br>Sab</th>`; }
                    else { headerTanggalHtml += `<th class="text-center p-1" style="font-size:10px;">${d}</th>`; }
                }
                tableHeaderHtml = `<tr><th>No</th><th>Nama Lengkap Siswa</th>${headerTanggalHtml}<th class="bg-success text-white">H</th><th class="bg-primary text-white">I</th><th class="bg-warning text-white">S</th><th class="bg-danger text-white">A</th><th class="bg-info text-white">%</th></tr>`;
                
                tableBodyHtml = siswaList.map((s, idx) => {
                    let cells = '';
                    let countH = 0, countI = 0, countS = 0, countA = 0, countTotal = 0;

                    for (let d = 1; d <= jumlahHari; d++) {
                        if (weekendMap[d]) {
                            cells += `<td class="text-center p-1" style="font-size:11px; background:#fce8e6; color:#c53929;">L</td>`;
                            continue;
                        }
                        // Cari format tanggal YYYY-MM-DD
                        const formattedDay = String(d).padStart(2, '0');
                        const formattedMonth = String(bulan + 1).padStart(2, '0');
                        const targetDateStr = `${tahun}-${formattedMonth}-${formattedDay}`;

                        const record = filteredAbsen.find(a => a.Tanggal === targetDateStr && String(a.NIS) === String(s.NIS));
                        let st = '-';
                        let styleColor = '';

                        if (record) {
                            countTotal++;
                            if (record.Status === 'Hadir') { st = 'H'; countH++; styleColor = 'color:#28a745; font-weight:bold;'; }
                            else if (record.Status === 'Izin') { st = 'I'; countI++; styleColor = 'color:#007bff; font-weight:bold;'; }
                            else if (record.Status === 'Sakit') { st = 'S'; countS++; styleColor = 'color:#ffc107; font-weight:bold;'; }
                            else if (record.Status === 'Alpa') { st = 'A'; countA++; styleColor = 'color:#dc3545; font-weight:bold;'; }
                        }
                        cells += `<td class="text-center p-1" style="font-size:11px; ${styleColor}">${st}</td>`;
                    }

                    let persentase = countTotal > 0 ? Math.round((countH / countTotal) * 100) : 0;
                    return `<tr><td class="text-center">${idx+1}</td><td><strong>${s.Nama}</strong><br><small>NIS: ${s.NIS}</small></td>${cells}<td class="text-success fw-bold">${countH}</td><td class="text-primary fw-bold">${countI}</td><td class="text-warning fw-bold">${countS}</td><td class="text-danger fw-bold">${countA}</td><td class="bg-info text-white fw-bold">${persentase}%</td></tr>`;
                }).join('');
            } else {
                // Untuk Guru Mapel, kelompokkan per pertemuan unik (tanggal urut) yang ada di database
                let uniqueDates = [...new Set(filteredAbsen.map(a => a.Tanggal))].sort();
                if (uniqueDates.length === 0) {
                    uniqueDates = ["-"]; // Default jika belum ada pertemuan
                }

                let headerPertemuanHtml = '';
                uniqueDates.forEach((ud, pIdx) => {
                    let displayDate = "-";
                    if (ud !== '-') {
                        // Memecah string tanggal YYYY-MM-DD secara presisi tanpa pergeseran zona waktu
                        const parts = ud.split('-');
                        if (parts.length === 3) {
                            displayDate = `${parts[2]}/${parts[1]}`;
                        }
                    }
                    headerPertemuanHtml += `<th class="text-center" style="font-size:11px;">P${pIdx + 1}<br><small style="font-size:9px;">${displayDate}</small></th>`;
                });

                tableHeaderHtml = `<tr><th rowspan="2" class="text-center align-middle">No</th><th rowspan="2" class="text-start align-middle">Nama Lengkap Siswa</th><th colspan="${uniqueDates.length}" class="text-center bg-secondary text-white">Pertemuan Bulanan (${namaBulan})</th><th colspan="5" class="text-center bg-dark text-white">Rekap</th></tr><tr>${headerPertemuanHtml}<th class="bg-success text-white">H</th><th class="bg-primary text-white">I</th><th class="bg-warning text-white">S</th><th class="bg-danger text-white">A</th><th class="bg-info text-white">%</th></tr>`;
                
                tableBodyHtml = siswaList.map((s, idx) => {
                    let cells = '';
                    let countH = 0, countI = 0, countS = 0, countA = 0, countTotal = 0;

                    uniqueDates.forEach(ud => {
                        let st = '-';
                        let styleColor = '';
                        if (ud !== '-') {
                            countTotal++;
                            const record = filteredAbsen.find(a => a.Tanggal === ud && String(a.NIS) === String(s.NIS));
                            if (record) {
                                if (record.Status === 'Hadir') { st = 'H'; countH++; styleColor = 'color:#28a745; font-weight:bold;'; }
                                else if (record.Status === 'Izin') { st = 'I'; countI++; styleColor = 'color:#007bff; font-weight:bold;'; }
                                else if (record.Status === 'Sakit') { st = 'S'; countS++; styleColor = 'color:#ffc107; font-weight:bold;'; }
                                else if (record.Status === 'Alpa') { st = 'A'; countA++; styleColor = 'color:#dc3545; font-weight:bold;'; }
                            }
                        }
                        cells += `<td class="text-center ${styleColor}">${st}</td>`;
                    });

                    let persentase = countTotal > 0 ? Math.round((countH / countTotal) * 100) : 0;
                    return `
                        <tr>
                            <td class="text-center">${idx+1}</td>
                            <td><strong>${s.Nama}</strong><br><small>NIS: ${s.NIS}</small></td>
                            ${cells}
                            <td class="text-center text-success fw-bold">${countH}</td>
                            <td class="text-center text-primary fw-bold">${countI}</td>
                            <td class="text-center text-warning fw-bold">${countS}</td>
                            <td class="text-center text-danger fw-bold">${countA}</td>
                            <td class="text-center bg-info text-white fw-bold">${persentase}%</td>
                        </tr>
                    `;
                }).join('');
            }

            const kepalaSekolah = db.Pengaturan ? db.Pengaturan.Kepsek : 'Hermin Rante Pasang, S.Pd';
            const nipKepsek = db.Pengaturan ? db.Pengaturan.NIPKepsek : '197503122005012001';
            const currentDateStr = new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'});

            Swal.fire({
                title: `<h4 class="fw-bold text-dark">${modalTitle}</h4>`,
                html: `
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="text-start small text-muted"><strong>Kelas:</strong> ${kelas || '-'} | <strong>Mapel:</strong> ${mapel} | <strong>Periode:</strong> ${namaBulan} ${tahun}</div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-danger btn-sm fw-bold" id="btn-cetak-pdf-rekap"><i class="fa-solid fa-file-pdf me-1"></i> Cetak PDF/Save</button>
                            <button type="button" class="btn btn-primary btn-sm fw-bold" id="btn-export-word-rekap"><i class="fa-solid fa-file-word me-1"></i> Export Word</button>
                        </div>
                    </div>
                    <div class="table-responsive" id="rekap-printable-content" style="max-height: 420px; overflow:auto;">
                        <table class="table table-bordered table-striped align-middle m-0" style="font-size:12px;">
                            <thead class="table-dark sticky-top">${tableHeaderHtml}</thead>
                            <tbody>${tableBodyHtml}</tbody>
                        </table>
                        
                        <div class="row mt-5 pt-3 text-dark" style="page-break-inside: avoid;">
                            <div class="col-6 text-center">
                                <p class="mb-5">Mengetahui,<br><strong>Kepala SDN 011 Sangatta Selatan</strong></p>
                                <p class="fw-bold text-decoration-underline mb-0 mt-5">${kepalaSekolah}</p>
                                <p class="small text-muted mb-0">NIP. ${nipKepsek}</p>
                            </div>
                            <div class="col-6 text-center">
                                <p class="mb-5">Sangatta Selatan, ${currentDateStr}<br><strong>Wali Kelas ${kelas || ''}</strong></p>
                                <p class="fw-bold text-decoration-underline mb-0 mt-5">( .................................................... )</p>
                                <p class="small text-muted mb-0">NIP. ...............................................</p>
                            </div>
                        </div>
                    </div>
                `,
                width: '95%',
                showConfirmButton: true,
                confirmButtonText: 'Tutup Laporan',
                confirmButtonColor: '#6c757d',
                didOpen: () => {
                    const btnPdf = document.getElementById("btn-cetak-pdf-rekap");
                    if (btnPdf) {
                        btnPdf.onclick = () => {
                            window.print();
                        };
                    }
                    const btnWord = document.getElementById("btn-export-word-rekap");
                    if (btnWord) {
                        btnWord.onclick = () => {
                            exportWordRekap();
                        };
                    }
                }
            });
        }

        function exportWordRekap() {
            const content = document.getElementById("rekap-printable-content").innerHTML;
            const headerHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Rekap Presensi</title></head><body>`;
            const footerHtml = `</body></html>`;
            const html = headerHtml + content + footerHtml;
            const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Rekap_Presensi_${Date.now()}.doc`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function saveBatchAbsensi() {
            const tgl = document.getElementById("absen-tgl").value;
            const kelas = document.getElementById("absen-kelas").value;
            const mapel = document.getElementById("absen-mapel").value;

            if (!db.Absensi) db.Absensi = [];
            window.activeAbsenSiswa.forEach(s => {
                // ID unik presensi berbasis Tanggal, Kelas, Mapel, dan NIS agar presisi dan tidak saling menimpa
                const recordID = "A_" + tgl + "_" + kelas + "_" + mapel + "_" + s.NIS;
                const rec = { ID: recordID, Tanggal: tgl, Kelas: kelas, MataPelajaran: mapel, NIS: s.NIS, Nama: s.Nama, Status: s.Status, Keterangan: s.Keterangan };
                
                const existingIdx = db.Absensi.findIndex(item => String(item.ID) === String(recordID));
                if (existingIdx !== -1) {
                    db.Absensi[existingIdx] = rec;
                } else {
                    db.Absensi.push(rec);
                }
                saveDB("Absensi", rec, "ID", rec.ID);
            });
            Swal.fire('Tersimpan!', 'Data presensi siswa berhasil disimpan ke sistem dengan presisi.', 'success');
        }

        function getNilaiHTML() {
            const isGuru = State.currentUser && State.currentUser.role === 'Guru';

            const optionsKelas = db.Kelas ? db.Kelas.filter(k => !isGuru || allowedClasses.includes(k.KodeKelas)).map(k => `<option value="${k.KodeKelas}">${k.KodeKelas}</option>`).join('') : '';

            return `
            <div class="mb-4">
                <h3 class="fw-bold mb-1">Input Nilai Akademik Siswa</h3>
                <p class="text-muted mb-0">Masukkan nilai capaian tujuan pembelajaran (TP 1 – TP 6), Sumatif, dan Projek siswa di kelas Anda.</p>
            </div>
            <div class="card-custom mb-4">

        function loadSiswaNilai(event) {
            if (event) event.preventDefault();
            const kelas = document.getElementById("nilai-kelas").value;
            const mapel = document.getElementById("nilai-mapel").value;
            const sem = document.getElementById("nilai-semester").value;

            if (!kelas || !mapel) {
                Swal.fire('Peringatan', 'Pilih kelas dan mata pelajaran terlebih dahulu.', 'warning');
                return;
            }

            const siswaFiltered = (db.Siswa || []).filter(s => s.Kelas === kelas && s.Status === 'Aktif');
            if (siswaFiltered.length === 0) {
                Swal.fire('Informasi', 'Tidak ada siswa aktif di kelas ini.', 'info');
                return;
            }

            const existingNilai = (db.Nilai || []).filter(n => String(n.Semester) === String(sem) && String(n.Kelas) === String(kelas) && String(n.MataPelajaran) === String(mapel));

            window.activeNilaiSiswa = siswaFiltered.map(s => {
                const found = existingNilai.find(item => String(item.NIS) === String(s.NIS));
                return {
                    NIS: s.NIS,
                    Nama: s.Nama,
                    TP1: found ? (found.TP1 ?? '') : '',
                    TP2: found ? (found.TP2 ?? '') : '',
                    TP3: found ? (found.TP3 ?? '') : '',
                    TP4: found ? (found.TP4 ?? '') : '',
                    TP5: found ? (found.TP5 ?? '') : '',
                    TP6: found ? (found.TP6 ?? '') : '',
                    Sumatif: found ? (found.Sumatif ?? '') : '',
                    Projek: found ? (found.Projek ?? '') : '',
                    NilaiAkhir: found && found.NilaiAkhir !== '' && !isNaN(found.NilaiAkhir) ? Number(found.NilaiAkhir) : 0,
                    Predikat: found && found.Predikat ? found.Predikat : '-',
                    Capaian: found && found.Capaian ? found.Capaian : 'Belum ada nilai yang diinputkan.'
                };
            });

            const tbody = document.getElementById("nilai-siswa-list");
            if (tbody) {
                tbody.innerHTML = window.activeNilaiSiswa.map((s, idx) => `
                    <tr>
                        <td class="text-start">
                            <strong class="text-dark">${s.Nama}</strong><br>
                            <small class="text-muted">NIS: ${s.NIS}</small>
                        </td>
                        <td><input type="number" min="0" max="100" id="tp1-${idx}" class="form-control text-center px-1 py-1 fw-semibold" style="font-size: 14px;" value="${s.TP1}" oninput="calcNilai(${idx})"></td>
                        <td><input type="number" min="0" max="100" id="tp2-${idx}" class="form-control text-center px-1 py-1 fw-semibold" style="font-size: 14px;" value="${s.TP2}" oninput="calcNilai(${idx})"></td>
                        <td><input type="number" min="0" max="100" id="tp3-${idx}" class="form-control text-center px-1 py-1 fw-semibold" style="font-size: 14px;" value="${s.TP3}" oninput="calcNilai(${idx})"></td>
                        <td><input type="number" min="0" max="100" id="tp4-${idx}" class="form-control text-center px-1 py-1 fw-semibold" style="font-size: 14px;" value="${s.TP4}" oninput="calcNilai(${idx})"></td>
                        <td><input type="number" min="0" max="100" id="tp5-${idx}" class="form-control text-center px-1 py-1 fw-semibold" style="font-size: 14px;" value="${s.TP5}" oninput="calcNilai(${idx})"></td>
                        <td><input type="number" min="0" max="100" id="tp6-${idx}" class="form-control text-center px-1 py-1 fw-semibold" style="font-size: 14px;" value="${s.TP6}" oninput="calcNilai(${idx})"></td>
                        <td><input type="number" min="0" max="100" id="sum-${idx}" class="form-control text-center px-1 py-1 fw-semibold" style="font-size: 14px;" value="${s.Sumatif}" oninput="calcNilai(${idx})"></td>
                        <td><input type="number" min="0" max="100" id="proj-${idx}" class="form-control text-center px-1 py-1 fw-semibold" style="font-size: 14px;" value="${s.Projek}" oninput="calcNilai(${idx})"></td>
                        <td><span id="na-${idx}" class="fw-bold text-success">${Number(s.NilaiAkhir).toFixed(2)}</span></td>
                        <td><span id="pred-${idx}" class="badge ${s.Predikat === 'A' ? 'bg-success' : s.Predikat === 'B' ? 'bg-primary' : s.Predikat === 'C' ? 'bg-warning text-dark' : s.Predikat === 'D' ? 'bg-danger' : 'bg-secondary'}">${s.Predikat}</span></td>
                        <td><small id="cap-${idx}" class="text-muted">${s.Capaian}</small></td>

            document.getElementById("nilai-daftar-card").classList.remove("d-none");
        }

        function calcNilai(idx) {
            const tp1 = document.getElementById(`tp1-${idx}`).value;
            const tp2 = document.getElementById(`tp2-${idx}`).value;
            const tp3 = document.getElementById(`tp3-${idx}`).value;
            const tp4 = document.getElementById(`tp4-${idx}`).value;
            const tp5 = document.getElementById(`tp5-${idx}`).value;
            const tp6 = document.getElementById(`tp6-${idx}`).value;
            const sum = document.getElementById(`sum-${idx}`).value;
            const proj = document.getElementById(`proj-${idx}`).value;
            
            const rawVals = [tp1, tp2, tp3, tp4, tp5, tp6, sum, proj].map(v => v !== '' && !isNaN(v) ? Number(v) : null).filter(v => v !== null);

            let na = 0;
            let predikat = '-';
            let capaian = 'Belum ada nilai yang diinputkan.';

            if (rawVals.length > 0) {
                const sumVals = rawVals.reduce((a, b) => a + b, 0);
                na = sumVals / rawVals.length;

                if (na >= 85) {
                    predikat = 'A';
                    capaian = 'Menunjukkan penguasaan kompetensi yang sangat matang.';
                } else if (na >= 75) {
                    predikat = 'B';
                    capaian = 'Menguasai kompetensi dasar dengan baik.';
                } else if (na >= 65) {
                    predikat = 'C';
                    capaian = 'Membutuhkan bimbingan tambahan pada beberapa indikator.';
                } else {
                    predikat = 'D';
                    capaian = 'Perlu bimbingan intensif dalam memahami materi.';
                }
            }

            window.activeNilaiSiswa[idx].TP1 = tp1;
            window.activeNilaiSiswa[idx].TP2 = tp2;
            window.activeNilaiSiswa[idx].TP3 = tp3;
            window.activeNilaiSiswa[idx].TP4 = tp4;
            window.activeNilaiSiswa[idx].TP5 = tp5;
            window.activeNilaiSiswa[idx].TP6 = tp6;
            window.activeNilaiSiswa[idx].Sumatif = sum;
            window.activeNilaiSiswa[idx].Projek = proj;
            window.activeNilaiSiswa[idx].NilaiAkhir = na;
            window.activeNilaiSiswa[idx].Predikat = predikat;
            window.activeNilaiSiswa[idx].Capaian = capaian;

            document.getElementById(`na-${idx}`).innerText = na.toFixed(2);
            const badgePred = document.getElementById(`pred-${idx}`);
            badgePred.innerText = predikat;
            badgePred.className = `badge ${predikat === 'A' ? 'bg-success' : predikat === 'B' ? 'bg-primary' : predikat === 'C' ? 'bg-warning text-dark' : predikat === 'D' ? 'bg-danger' : 'bg-secondary'}`;
            document.getElementById(`cap-${idx}`).innerText = capaian;
        }

        function saveBatchNilai() {
            const kelas = document.getElementById("nilai-kelas").value;
            const mapel = document.getElementById("nilai-mapel").value;
            const sem = document.getElementById("nilai-semester").value;

            if (!db.Nilai) db.Nilai = [];
            window.activeNilaiSiswa.forEach(s => {
                const recordID = "N_" + sem + "_" + kelas + "_" + mapel + "_" + s.NIS;
                const rec = { 
                    ID: recordID, 
                    Kelas: kelas, 
                    MataPelajaran: mapel, 
                    Semester: sem, 
                    NIS: s.NIS, 
                    Nama: s.Nama, 
                    TP1: s.TP1,
                    TP2: s.TP2,
                    TP3: s.TP3,
                    TP4: s.TP4,
                    TP5: s.TP5,
                    TP6: s.TP6,
                    Sumatif: s.Sumatif,
                    Projek: s.Projek,
                    NilaiAkhir: s.NilaiAkhir,
                    Predikat: s.Predikat,
                    Capaian: s.Capaian 
                };

                const existingIdx = db.Nilai.findIndex(item => String(item.ID) === String(recordID));
                if (existingIdx !== -1) {
                    db.Nilai[existingIdx] = rec;
                } else {
                    db.Nilai.push(rec);
                }
                saveDB("Nilai", rec, "ID", rec.ID);
            });
            Swal.fire('Tersimpan!', 'Nilai capaian siswa berhasil disimpan ke sistem dengan presisi tinggi.', 'success');
        }

            db.Pengaturan.NPSN = document.getElementById("cfg-npsn").value;
            db.Pengaturan.Kepsek = document.getElementById("cfg-kepsek").value;
            saveDB("Pengaturan", db.Pengaturan, null, null);
            Swal.fire('Tersimpan', '', 'success');
        }

        function processImportSiswa() {
            const fileInput = document.getElementById("import-siswa-file");
            if (!fileInput.files.length) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const rows = e.target.result.split("\n");
                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i].split(",");
                    if (cols.length >= 10) {
                        const s = { NIS: "S" + Math.floor(Math.random()*1000), NISN: cols[0].trim(), Nama: cols[1].trim(), JenisKelamin: cols[2].trim(), TempatLahir: cols[3].trim(), TanggalLahir: cols[4].trim(), Alamat: cols[5].trim(), NamaOrangTua: cols[6].trim(), NoHP: cols[7].trim(), Kelas: cols[8].trim(), Status: "Aktif" };
                        if (!db.Siswa) db.Siswa = [];
                        db.Siswa.push(s);
                        saveDB("Siswa", s, "NIS", s.NIS);
                    }
                }
                hideModalSafe('importSiswaModal');
                Swal.fire('Sukses', 'Data siswa berhasil diimpor.', 'success');
                switchView('siswa');
            };
            reader.readAsText(fileInput.files[0]);
        }

        function saveSiswa(event) {
            event.preventDefault();
            const idx = document.getElementById("siswa-idx").value;
            const s = {
                NIS: document.getElementById("siswa-nis").value,
                NISN: document.getElementById("siswa-nisn").value,
                Nama: document.getElementById("siswa-nama").value,
                JenisKelamin: document.getElementById("siswa-jk").value,
                Kelas: document.getElementById("siswa-kelas").value,
                TempatLahir: document.getElementById("siswa-tempat").value,
                TanggalLahir: document.getElementById("siswa-tgl").value,
                Alamat: document.getElementById("siswa-alamat").value,
                NamaOrangTua: document.getElementById("siswa-ortu").value,
                NoHP: document.getElementById("siswa-hp").value,
                Status: document.getElementById("siswa-status").value
            };
            if (!db.Siswa) db.Siswa = [];
            if (idx === "") db.Siswa.push(s); else db.Siswa[idx] = s;
            saveDB("Siswa", s, "NIS", s.NIS);
            hideModalSafe('siswaModal');
            switchView('siswa');
        }

        function handleLoginSubmit(event) {
            event.preventDefault();
            showLoader("Otentikasi...");
            const usr = document.getElementById("username").value.trim();
            const pas = document.getElementById("password").value.trim();

            fetchAPI({ action: 'loginUser', username: usr, password: pas })
                .then(response => {
                    hideLoader();
                    if (response && response.success) {
                        State.currentUser = response.user;
                        sessionStorage.setItem("sias_user", JSON.stringify(response.user));
                        initApp();
                    } else {
                        Swal.fire('Gagal', (response && response.message) ? response.message : "Otentikasi gagal!", 'error');
                    }
                })
                .catch(() => {
                    hideLoader();
                    // Fallback login lokal instan jika server lambat
                    if (usr === "admin" && pas === "admin123") {
                        State.currentUser = { username: "admin", nama: "Administrator Utama", role: "Admin" };
                        sessionStorage.setItem("sias_user", JSON.stringify(State.currentUser));
                        initApp();
                    } else {
                        Swal.fire('Gagal', 'Periksa kembali username atau sandi Anda.', 'error');
                    }
                });
        }

        function initDataTable(id) {
            setTimeout(() => {
                if (typeof $ !== 'undefined' && $.fn && $.fn.DataTable) {
                    $('#' + id).DataTable({ retrieve: true, destroy: true });
                }
            }, 50);
        }

        function initDashboardCharts() {
            const ctxAbsen = document.getElementById('absensiChart');
            const ctxNilai = document.getElementById('nilaiChart');
            
            if (ctxAbsen && !State.charts.absen) {
                State.charts.absen = new Chart(ctxAbsen, {
                    type: 'doughnut',
                    data: { 
                        labels: ['Hadir', 'Izin', 'Sakit', 'Alpa'], 
                        datasets: [{ 
                            data: [85, 8, 5, 2], 
                            backgroundColor: ['#10b981', '#f59e0b', '#0ea5e9', '#ef4444'],
                            borderWidth: 0,
                            hoverOffset: 5
                        }] 
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false,
                        cutout: '75%',
                        plugins: { 
                            legend: { 
                                position: 'bottom', 
                                labels: { usePointStyle: true, padding: 20, font: { family: "'Plus Jakarta Sans', sans-serif", size: 12 } } 
                            } 
                        } 
                    }
                });
            }
            
            if (ctxNilai && !State.charts.nilai) {
                const ctx = ctxNilai.getContext('2d');
                let gradient = ctx.createLinearGradient(0, 0, 0, 300);
                gradient.addColorStop(0, 'rgba(5, 150, 105, 0.4)');
                gradient.addColorStop(1, 'rgba(5, 150, 105, 0.0)');

                State.charts.nilai = new Chart(ctxNilai, {
                    type: 'line',
                    data: { 
                        labels: ['TP 1', 'TP 2', 'TP 3', 'TP 4', 'TP 5', 'TP 6', 'Sumatif'], 
                        datasets: [{ 
                            label: 'Capaian Nilai', 
                            data: [72, 75, 78, 81, 84, 83, 86], 
                            borderColor: '#059669', 
                            backgroundColor: gradient,
                            borderWidth: 3,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: '#059669',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            fill: true,
                            tension: 0.4 // Ini yang membuat grafiknya menjadi kurva mulus modern
                        }] 
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { 
                            y: { 
                                beginAtZero: false, 
                                min: 50, 
                                max: 100, 
                                grid: { borderDash: [5, 5], color: 'rgba(0, 0, 0, 0.05)' },
                                ticks: { font: { family: "'Plus Jakarta Sans', sans-serif" } }
                            },
                            x: { 
                                grid: { display: false },
                                ticks: { font: { family: "'Plus Jakarta Sans', sans-serif" } }
                            }
                        } 
                    }
                });
            }
        }

        function exportExcel(sheetName) {
            Swal.fire('Ekspor', `Data ${sheetName} berhasil diekspor.`, 'success');
        }

        window.onload = function() {
            initAppDatabase();
        };
    </script>
